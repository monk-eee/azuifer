name: Rust

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: rustup show
      - run: cargo fetch --locked
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - if: runner.os == 'Linux'
        run: python3 -m unittest discover -s packaging
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c
        with:
          tool: cargo-llvm-cov@0.8.7
      - run: cargo llvm-cov --workspace --all-features --locked --lcov --output-path coverage.lcov
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rust-coverage
          path: coverage.lcov
          if-no-files-found: error
  container:
    name: Azure Linux and Azure CLI compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: docker build --tag azuifer:ci .
      - name: Verify the last four Azure CLI releases against the container
        id: azure-cli
        run: python3 tests/azure_cli_matrix.py
      - name: Upload Azure CLI compatibility evidence
        if: always() && steps.azure-cli.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: azure-cli-compatibility
          path: dist/azure-cli-compatibility.json
          if-no-files-found: error
  dotnet-sdk:
    name: .NET Azure SDK compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: cargo build --locked
      - name: Run the .NET SDK scenarios against all five services
        run: |
          ./target/debug/azuifer serve --in-memory --memory-limit 1073741824 \
            --skip-api-version-check --services blob,queue,table,file,dfs \
            --hns-accounts devstoreaccount1 > azuifer.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fs http://127.0.0.1:10005/readyz && break
            sleep 1
          done
          dotnet run --project tests/dotnet_sdk
      - name: Show the server log on failure
        if: failure()
        run: tail -n 100 azuifer.log
  js-sdk:
    name: JavaScript Azure SDK compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: cargo build --locked
      - run: npm ci
        working-directory: tests/js_sdk
      - name: Run the JavaScript SDK scenarios against all five services
        run: |
          echo "127.0.0.1 devstoreaccount1.dfs.localhost devstoreaccount1.blob.localhost" | sudo tee -a /etc/hosts
          ../../target/debug/azuifer serve --in-memory --memory-limit 1073741824 \
            --skip-api-version-check --services blob,queue,table,file,dfs \
            --hns-accounts devstoreaccount1 --dfs-port 20003 > azuifer.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fs http://127.0.0.1:10005/readyz && break
            sleep 1
          done
          node probe.js
        working-directory: tests/js_sdk
      - name: Show the server log on failure
        if: failure()
        run: tail -n 100 tests/js_sdk/azuifer.log
  java-sdk:
    name: Java Azure SDK compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: cargo build --locked
      - name: Run the Java SDK scenarios against all five services
        run: |
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
          echo "127.0.0.1 devstoreaccount1.file.localhost" | sudo tee -a /etc/hosts
          ../../target/debug/azuifer serve --in-memory --memory-limit 1073741824 \
            --skip-api-version-check --services blob,queue,table,file,dfs \
            --hns-accounts devstoreaccount1 --file-port 80 > azuifer.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fs http://127.0.0.1:10005/readyz && break
            sleep 1
          done
          mvn -q -B compile exec:java
        working-directory: tests/java_sdk
      - name: Show the server log on failure
        if: failure()
        run: tail -n 100 tests/java_sdk/azuifer.log
  go-sdk:
    name: Go Azure SDK compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: cargo build --locked
      - name: Run the Go SDK scenarios against all five services
        run: |
          ../../target/debug/azuifer serve --in-memory --memory-limit 1073741824 \
            --skip-api-version-check --services blob,queue,table,file,dfs \
            --hns-accounts devstoreaccount1 > azuifer.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fs http://127.0.0.1:10005/readyz && break
            sleep 1
          done
          go run .
        working-directory: tests/go_sdk
      - name: Show the server log on failure
        if: failure()
        run: tail -n 100 tests/go_sdk/azuifer.log
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda
        with:
          arguments: --all-features --locked
          command: check
