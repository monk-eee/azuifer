# Azuifer with every service, persistent state, and a readiness healthcheck.
#
#   export AZUIFER_ACCOUNT_KEY="$(openssl rand -base64 32)"
#   docker compose -f packaging/compose.yaml up --build --wait
#
# The key must be Base64 that decodes to 32 through 64 bytes. The container binds
# 0.0.0.0 so Compose can publish the ports, and Azuifer refuses the public
# development key on a non-loopback bind. Ports are published on localhost only.
services:
  azuifer:
    build:
      context: ..
    image: azuifer:compose
    command: ["serve", "--bind", "0.0.0.0", "--location", "/data", "--skip-api-version-check"]
    environment:
      AZUIFER_ACCOUNT_KEY: ${AZUIFER_ACCOUNT_KEY:?set AZUIFER_ACCOUNT_KEY to a Base64 key of 32 to 64 bytes}
    ports:
      - "127.0.0.1:10000:10000" # Blob
      - "127.0.0.1:10001:10001" # Queue
      - "127.0.0.1:10002:10002" # Table
      - "127.0.0.1:10003:10003" # Data Lake (DFS)
      - "127.0.0.1:10004:10004" # Files
      - "127.0.0.1:10005:10005" # admin: /healthz, /readyz, /status
    volumes:
      - azuifer-data:/data
    read_only: true
    healthcheck:
      test: ["CMD", "/azuifer", "status", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    stop_grace_period: 15s

volumes:
  azuifer-data:
